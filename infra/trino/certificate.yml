# Trino with the machines' certificates (decision 0066, points 9 and 12; step
# 9). An overlay of docker-compose.yml for an installation whose machines
# have certificates; development does not use it (compose.dev.yml: the dev
# CA's certificate, and the rules read with QUALITY_TRINO_RULES_KEY):
#
#   docker compose --project-directory . -f infra/trino/docker-compose.yml \
#     -f infra/trino/certificate.yml up -d coordinator
#
# (on the coordinator's VM; `worker worker-lake` on each worker's). Each node mounts its
# own node agent's directory (QD_MACHINE_DIR) at /run/qd-node, read-only:
#
# - the coordinator reads its rules from the API on Traefik's internal entry
#   point with its machine certificate (role trino-coordinator), no key in
#   the URL (etc/coordinator/access-control.certificate.properties);
# - every node serves HTTPS with its machine certificate, read again every
#   minute when renewed, and the nodes talk HTTPS only, by their machine
#   names, trusting the installation's CA alone (config.certificate.properties);
# - the coordinator's agent runs held (QD_RENEW_MODE=held,
#   QD_HELD_READY="qd-node trino-ready", QD_AFTER_RENEW="qd-node
#   trino-restart", QD_TRINO_RESTART, QD_TRINO_INFO_URL): Trino reads its
#   client certificate once, so it is restarted to take a new one, only when
#   the API says Trino is free; a worker's agent runs rolling (no restart).
#
# - every node reaches the lake through its gate presenting its machine
#   certificate (decision 0066, point 10). entrypoint.sh makes the JVM's
#   keystore from machine.pem at each start (PemKeystore.java) and adds the
#   installation's CA to its truststore. The JVM reads the keystore once:
#   the coordinator, whose TRINO_LAKE_S3_URL is the gate
#   (https://<the lake node's name>:9000), takes a renewed certificate with
#   the restart above. Nothing restarts a worker, so it reaches the lake
#   through a proxy on its loopback instead (`worker-lake`, the DuckDB
#   workers' infra/worker/lake/entrypoint.sh, in the worker's network
#   namespace), which presents machine.pem to the gate (QD_LAKE_GATE) and
#   takes the renewed one by itself: the worker's TRINO_LAKE_S3_URL is
#   https://<its own name>:9000, its own name its loopback's. The catalog
#   the coordinator sends reads that address on each node from its own
#   environment (tools/verify/trino_worker_lake_proxy.sh). Start both on a
#   worker's VM: `up -d worker worker-lake`.
#
# The agent writes machine.pem 0600 and its directory 0700, as its own user:
# it runs as Trino's user, uid 1000 (the image's `trino`), so Trino reads
# them as they are; as another uid Trino does not start
# (tools/verify/trino_stack_cert.sh). Who runs the agent, and with what right
# to restart the coordinator's container, is step 11's.
#
# Required environment, besides docker-compose.yml's (but
# QUALITY_TRINO_RULES_KEY, which is not set here):
#   QD_MACHINE_DIR       this node's agent directory (QD_AGENT_DIR)
#   TRINO_NODE_NAME      this node's machine name, the only name in its
#                        certificate, which the other nodes resolve
#   TRINO_DISCOVERY_URI  https://<the coordinator's machine name>:8490
#   INTERNAL_DOMAIN      the internal entry point's name (or TRINO_RULES_URL)
#   QD_LAKE_GATE         on a worker: the lake's gate, <the lake node's
#                        name>:<port> (9000)
# Optional: TRAEFIK_IMAGE (traefik:v3.6), QD_LAKE_CHECK_EVERY (30, seconds).
#
# Verified with tools/verify/trino_stack_cert.sh and, the worker's proxy,
# trino_worker_lake_proxy.sh; `worker-lake` itself only by `docker compose
# config`.
services:
  coordinator:
    environment:
      TRINO_NODE_NAME: ${TRINO_NODE_NAME:?set TRINO_NODE_NAME to this node's machine name}
      TRINO_DISCOVERY_URI: ${TRINO_DISCOVERY_URI:?set TRINO_DISCOVERY_URI to https://<coordinator>:8490}
      TRINO_RULES_URL: ${TRINO_RULES_URL:-https://${INTERNAL_DOMAIN:?set INTERNAL_DOMAIN}:9443/api/internal/trino/rules}
    volumes:
      - ${QD_MACHINE_DIR:?set QD_MACHINE_DIR to the node agent's directory}:/run/qd-node:ro
      - ./infra/trino/etc/coordinator/config.certificate.properties:/etc/trino/config.properties:ro
      - ./infra/trino/PemKeystore.java:/etc/trino/PemKeystore.java:ro
      - ./infra/trino/etc/coordinator/access-control.certificate.properties:/etc/trino/access-control.properties:ro

  worker:
    extra_hosts:
      - "${TRINO_NODE_NAME}:127.0.0.1"
    environment:
      TRINO_NODE_NAME: ${TRINO_NODE_NAME:?set TRINO_NODE_NAME to this node's machine name}
      TRINO_DISCOVERY_URI: ${TRINO_DISCOVERY_URI:?set TRINO_DISCOVERY_URI to https://<coordinator>:8490}
      # Its proxy, below.
      TRINO_LAKE_S3_URL: https://${TRINO_NODE_NAME}:9000
    volumes:
      - ${QD_MACHINE_DIR:?set QD_MACHINE_DIR to the node agent's directory}:/run/qd-node:ro
      - ./infra/trino/etc/worker/config.certificate.properties:/etc/trino/config.properties:ro
      - ./infra/trino/PemKeystore.java:/etc/trino/PemKeystore.java:ro

  # The worker's way to the lake's gate, on its loopback.
  worker-lake:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    network_mode: "service:worker"
    entrypoint: ["/etc/qd/lake/entrypoint.sh"]
    environment:
      QD_LAKE_GATE: ${QD_LAKE_GATE:-}
      QD_LAKE_CHECK_EVERY: ${QD_LAKE_CHECK_EVERY:-30}
    tmpfs:
      - /run/qd-lake:uid=1000,gid=1000,mode=0700
    volumes:
      - ./infra/worker/lake/entrypoint.sh:/etc/qd/lake/entrypoint.sh:ro
      - ${QD_MACHINE_DIR:?set QD_MACHINE_DIR to the node agent's directory}:/run/qd-node:ro
