# The coordinator's config.properties for an installation whose machines
# have certificates (decision 0066, points 9 and 12; certificate.yml mounts
# it in that file's place). The same as config.properties, whose comments
# explain each setting, but for the node agent's certificate as Trino's own
# and HTTPS between the nodes.
coordinator=true
node-scheduler.include-coordinator=false
http-server.http.port=8090
query.max-memory=1536MB
query.max-memory-per-node=768MB
catalog.management=dynamic
catalog.store=file
regex-library=RE2J

# Between the nodes, HTTPS only, with the shared secret as before. Each node
# announces itself by its machine name (TRINO_NODE_NAME), the only name in
# its certificate, which the other nodes resolve; they trust the
# installation's CA alone. discovery.uri is https://<coordinator>:8490.
discovery.uri=${ENV:TRINO_DISCOVERY_URI}
node.internal-address=${ENV:TRINO_NODE_NAME}
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
internal-communication.https.required=true
internal-communication.https.truststore.path=/run/qd-node/ca.crt

# HTTPS with the node agent's certificate (QD_MACHINE_DIR, at
# /run/qd-node): one PEM file, certificate then key, read again every
# minute when it changes, so the server side takes a renewal without a
# restart (verified, tools/verify/trino_mtls.sh). The file is the agent's
# (0600): the agent runs as Trino's user (uid 1000), see certificate.yml.
http-server.https.enabled=true
http-server.https.port=8490
http-server.https.keystore.path=/run/qd-node/machine.pem
http-server.https.ssl-context.refresh-time=1m

# Clients: a JWT of Quality Data's OIDC provider, as config.properties.
http-server.authentication.type=oauth2,jwt
http-server.authentication.jwt.key-file=/data/trino/jwks/${KID}.pem
http-server.authentication.jwt.required-issuer=${ENV:TRINO_JWT_ISSUER}
http-server.authentication.jwt.required-audience=trino
http-server.authentication.jwt.user-mapping.file=/etc/trino/user-mapping.json
http-server.authentication.allow-insecure-over-http=false
http-server.process-forwarded=true

# The Web UI, as config.properties.
web-ui.authentication.type=oauth2
http-server.authentication.oauth2.issuer=${ENV:TRINO_JWT_ISSUER}
http-server.authentication.oauth2.client-id=trino
http-server.authentication.oauth2.client-secret=${ENV:TRINO_OIDC_CLIENT_SECRET}
http-server.authentication.oauth2.scopes=openid,email,profile
http-server.authentication.oauth2.principal-field=email

# Its output as JSON (decision 0026, point 1).
log.console-format=json
