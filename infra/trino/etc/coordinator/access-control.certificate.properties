# Who may do what, as access-control.properties (decision 0062), for an
# installation whose machines have certificates (decision 0066, point 9;
# certificate.yml mounts it in that file's place). The coordinator reads its
# rules from the API on Traefik's internal entry point with its machine
# certificate, and no secret goes in the URL, so none is in Trino's log or
# in a client's error.
access-control.name=file
# https://<INTERNAL_DOMAIN>:9443/api/internal/trino/rules
security.config-file=${ENV:TRINO_RULES_URL}
# The node agent's files (QD_MACHINE_DIR, mounted at /run/qd-node): its
# certificate and key in one PEM file, presented to the API, and the
# installation's CA, the only one the API's internal entry point is checked
# against. Trino reads the key store once, at start: a renewed certificate
# is taken by restarting the coordinator when Trino is free (qd-node
# trino-ready and trino-restart).
system-access-control.http-client.key-store-path=/run/qd-node/machine.pem
system-access-control.http-client.trust-store-path=/run/qd-node/ca.crt
security.refresh-period=10s
