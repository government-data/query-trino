coordinator=true
# The work goes to the workers; the coordinator only plans and follows.
node-scheduler.include-coordinator=false
http-server.http.port=8090
discovery.uri=${ENV:TRINO_DISCOVERY_URI}
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
query.max-memory=1536MB
query.max-memory-per-node=768MB

# The sources become catalogs from the application (decision 0029): CREATE
# CATALOG / DROP CATALOG, stored as files in the data directory (a volume,
# catalog-store.properties), readable only by Trino. The static ones
# (etc/catalog) are copied there at start.
catalog.management=dynamic
catalog.store=file

# The API and the workers: over HTTPS (port 8490, the machine's certificate,
# see entrypoint.sh), with a JWT signed by Quality Data's OIDC provider for
# this audience (decision 0030). The public keys are files, one per key id,
# written from the provider's JWKS by entrypoint.sh. Trino 484 verifies RSA
# and EC keys only: the provider signs this audience's tokens with its EC
# P-256 key (ES256); its Ed25519 keys (EdDSA) are skipped.
http-server.https.enabled=true
http-server.https.port=8490
http-server.https.keystore.path=/data/trino/https.pem
http-server.authentication.type=oauth2,jwt
http-server.authentication.jwt.key-file=/data/trino/jwks/${KID}.pem
http-server.authentication.jwt.required-issuer=${ENV:TRINO_JWT_ISSUER}
http-server.authentication.jwt.required-audience=trino
# A job's token (decision 0062) has the subject
# job:<tenant>:<job>:read:src_<source>, or …:extract:<dataset> for an
# extraction; user-mapping.json makes it the user the rules let read that
# catalog only (src_<source>), or _<dataset>, which reads its source's
# catalog and writes its bronze schema, and refuses any other subject
# shaped like a job's user.
http-server.authentication.jwt.user-mapping.file=/etc/trino/user-mapping.json
# Plain HTTP (8090) stays for the nodes (internal-communication) and for
# Traefik, which sends the Web UI's requests with X-Forwarded-Proto: https.
# A client's request over plain HTTP is refused; one that claims HTTPS in
# that header still needs a valid JWT.
http-server.authentication.allow-insecure-over-http=false
http-server.process-forwarded=true

# The Web UI: people sign in with Quality Data (OAuth 2.0 with OIDC), each
# as themselves (their e-mail); the provider gives a token for this client
# only to accounts with the policy `quality-admin` (its `required_policy`),
# signed with ES256, and without PKCE, which Trino does not send (the client
# authenticates with its secret, and the ID token carries a nonce). Its
# callback is /oauth2/callback, routed by the application's Traefik.
web-ui.authentication.type=oauth2
http-server.authentication.oauth2.issuer=${ENV:TRINO_JWT_ISSUER}
http-server.authentication.oauth2.client-id=trino
http-server.authentication.oauth2.client-secret=${ENV:TRINO_OIDC_CLIENT_SECRET}
http-server.authentication.oauth2.scopes=openid,email,profile
http-server.authentication.oauth2.principal-field=email
# Regular expressions on RE2J, as DuckDB's RE2: linear in time, so a rule's
# pattern cannot hang the cluster, and the same on both engines (decision
# 0033, point 6). Joni, the default, backtracks.
regex-library=RE2J

# Its output as JSON, one object per line (`timestamp`, `level`, `thread`,
# `logger`, `message`), like every service (decision 0026, point 1).
# Not `log.format`, which is only the log file's.
log.console-format=json
