# Who may do what (file-based access control, decision 0062): the rules are
# read from the API, which writes them from the catalog. The API's own
# client (qd-api) owns every catalog; a read job's user reads its source's
# catalog only; an extraction's, its dataset's source and bronze schema;
# people see and cancel queries; any other user, a worker's machine client
# among them, runs nothing.
access-control.name=file
# Trino sends no header when it asks: the API knows it by the secret in the
# query (TRINO_RULES_KEY, the API's QUALITY_TRINO_RULES_KEY), over HTTPS.
# Development only: with the machines' certificates the coordinator asks with
# its own instead, and no secret (access-control.certificate.properties,
# mounted here by certificate.yml; decision 0066, step 9).
# The API's certificate is checked against the JVM's trust store, which
# entrypoint.sh extends with the development CA; for a CA of your own,
# system-access-control.http-client.trust-store-path=<PEM file> here.
security.config-file=${ENV:TRINO_RULES_URL}?key=${ENV:TRINO_RULES_KEY}
# Trino keeps the rules this long and asks again when a query comes after:
# a dataset just mapped waits up to it (the worker's extraction tries once
# more after 12 s, crates/worker/src/trino_job.rs). While the API does not
# answer, every query fails, and Trino does not start.
security.refresh-period=10s
