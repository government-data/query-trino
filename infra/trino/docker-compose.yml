# Trino (Apache-2.0): the execution plane's cluster for large extractions and
# evaluations (decision 0018), on its own servers, never on the
# application's. This file is its own stack, not part of the application's
# compose: in production the coordinator and each worker run on their own
# VMs (each with this file, only its service up); in development it stands
# for them.
#
# The application reaches it by URL, never by Docker labels:
#   - the API and the workers send their SQL to the coordinator over HTTPS
#     (port 8490), authenticated with a JWT signed by Quality Data's OIDC
#     provider (decision 0030; see etc/coordinator/config.properties);
#   - the application's Traefik routes the Web UI (/ui) to it, behind the
#     application's sign-in for administrators (infra/traefik/dynamic/apps-trino.yml).
#
#   task trino:up | trino:down | trino:logs
#
# Required environment (in the repo `.env`):
#   TRINO_SHARED_SECRET                     the nodes' internal secret
#   TRINO_LAKE_ACCESS_KEY, TRINO_LAKE_SECRET_KEY
#                                           its RustFS user, limited to the
#                                           lake's buckets (infra/trino/lake-user.sh)
#   QUALITY_TRINO_RULES_KEY                 development only (compose.dev.yml):
#                                           the secret the coordinator sends
#                                           the API when it reads its rules
#                                           (decision 0062), the API's too;
#                                           with certificate.yml, none: the
#                                           machine's certificate (0066)
#
# The coordinator reads its access-control rules from the API
# (TRINO_RULES_URL): it does not start until the API answers (it restarts
# until then), and while the API is down every query fails.
# And on the coordinator, its HTTPS certificate and key at
# /etc/trino/tls/tls.crt and tls.key (in production the machine's
# certificate; compose.dev.yml mounts the development one).
name: data-quality-trino # `-p` in the tasks: .env sets COMPOSE_PROJECT_NAME for the app

volumes:
  # The coordinator's data directory, with the catalogs created from the
  # application (`CREATE CATALOG`, decision 0029): they survive a restart.
  trino-coordinator-data:
  trino-worker-data:

x-trino: &trino
  image: ${TRINO_IMAGE:-trinodb/trino:484}
  restart: unless-stopped
  entrypoint: ["/bin/bash", "/etc/trino/entrypoint.sh"]
  environment: &trino-env
    TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET:?set TRINO_SHARED_SECRET in .env}
    # The coordinator, as the nodes reach it (in production, its server).
    TRINO_DISCOVERY_URI: ${TRINO_DISCOVERY_URI:-http://127.0.0.1:8090}
    # The lake (RustFS): its S3 API and its Iceberg REST catalog.
    TRINO_LAKE_S3_URL: ${TRINO_LAKE_S3_URL:-http://127.0.0.1:9000}
    TRINO_LAKE_WAREHOUSE: ${TRINO_LAKE_WAREHOUSE:-qd-tenant-00000000000000000000000000000001}
    TRINO_LAKE_ACCESS_KEY: ${TRINO_LAKE_ACCESS_KEY:?set TRINO_LAKE_ACCESS_KEY in .env (infra/trino/lake-user.sh)}
    TRINO_LAKE_SECRET_KEY: ${TRINO_LAKE_SECRET_KEY:?set TRINO_LAKE_SECRET_KEY in .env (infra/trino/lake-user.sh)}
    # Quality Data's OIDC provider: the issuer of the JWTs Trino accepts.
    TRINO_JWT_ISSUER: ${OIDC_ISSUER:-https://${APP_DOMAIN:-localhost}/api}
  healthcheck:
    test: ["CMD", "/usr/lib/trino/bin/health-check"]
    interval: 10s
    timeout: 5s
    start_period: 60s
    retries: 12

services:
  coordinator:
    <<: *trino
    environment:
      <<: *trino-env
      # Quality Data's JWK Set, read again every few minutes (entrypoint.sh).
      TRINO_JWKS_URL: ${TRINO_JWKS_URL:-https://${APP_DOMAIN:-localhost}/api/oauth/jwks}
      # Its OIDC client's secret, for the Web UI's sign-in with Quality Data.
      TRINO_OIDC_CLIENT_SECRET: ${TRINO_OIDC_CLIENT_SECRET:?set TRINO_OIDC_CLIENT_SECRET in .env}
      # Its access-control rules: the API's route and, in development, the
      # secret it asks with (etc/coordinator/access-control.properties;
      # compose.dev.yml requires it). With certificate.yml the coordinator
      # asks with its machine certificate on the internal entry point, and
      # no secret is set.
      TRINO_RULES_URL: ${TRINO_RULES_URL:-https://${APP_DOMAIN:-localhost}/api/internal/trino/rules}
      TRINO_RULES_KEY: ${QUALITY_TRINO_RULES_KEY:-}
    volumes:
      - ./infra/trino/entrypoint.sh:/etc/trino/entrypoint.sh:ro
      - ./infra/trino/etc/coordinator/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/etc/coordinator/node.properties:/etc/trino/node.properties:ro
      - ./infra/trino/etc/coordinator/catalog-store.properties:/etc/trino/catalog-store.properties:ro
      - ./infra/trino/etc/coordinator/access-control.properties:/etc/trino/access-control.properties:ro
      - ./infra/trino/etc/coordinator/user-mapping.json:/etc/trino/user-mapping.json:ro
      - ./infra/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./infra/trino/etc/log.properties:/etc/trino/log.properties:ro
      # The static catalogs, copied at start into the catalog directory.
      - ./infra/trino/etc/catalog:/etc/trino/static-catalog:ro
      - trino-coordinator-data:/data/trino

  worker:
    <<: *trino
    volumes:
      - ./infra/trino/entrypoint.sh:/etc/trino/entrypoint.sh:ro
      - ./infra/trino/etc/worker/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/etc/worker/node.properties:/etc/trino/node.properties:ro
      - ./infra/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./infra/trino/etc/log.properties:/etc/trino/log.properties:ro
      - trino-worker-data:/data/trino
