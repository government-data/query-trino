# A Trino worker of query-trino on a `trino-worker` machine (quality-sdk
# decision 0011): it joins engine-trino's coordinator at the same release.
# `${ENV:…}` values come from compose.yml and entrypoint.sh, which appends
# the tier's memory, spill and shutdown settings.
coordinator=false
catalog.management=dynamic
deprecated.regex-library=RE2J

# Between the nodes: HTTPS only, the coordinator's shared secret, each
# node by its machine name, trusting the installation's CA alone.
discovery.uri=${ENV:TRINO_DISCOVERY_URI}
node.internal-address=${ENV:TRINO_NODE_NAME}
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
internal-communication.https.required=true
internal-communication.https.truststore.path=/run/qd-node/ca.crt

# HTTPS with this machine's certificate, read again every minute. Plain
# HTTP on 8091 stays for the health check and the graceful shutdown, from
# the machine itself.
http-server.http.port=8091
http-server.https.enabled=true
http-server.https.port=8491
http-server.https.keystore.path=/run/qd-node/machine.pem
http-server.https.ssl-context.refresh-time=1m

log.console-format=json
